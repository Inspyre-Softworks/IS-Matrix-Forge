name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: abatilo/actions-poetry@fd0e6716a0de25ef6ade151b8b53190b0376acfd # v3

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      - name: Run tests
        run: poetry run pytest

      - name: Build and smoke-test wheel entry points
        run: |
          poetry build --format wheel
          SMOKE_DIR="$RUNNER_TEMP/is-matrix-forge-wheel"
          PYTHON_BIN="$(poetry env info --executable)"
          "$PYTHON_BIN" -m pip install --no-deps --target "$SMOKE_DIR" dist/*.whl
          cd "$RUNNER_TEMP"
          SMOKE_DIR="$SMOKE_DIR" "$PYTHON_BIN" - <<'PY'
          import os
          import sys
          from importlib.metadata import distributions

          target = os.environ["SMOKE_DIR"]
          sys.path.insert(0, target)
          distribution = next(
              dist
              for dist in distributions(path=[target])
              if dist.metadata["Name"] == "IS-Matrix-Forge"
          )
          scripts = {
              entry_point.name: entry_point
              for entry_point in distribution.entry_points
              if entry_point.group == "console_scripts"
          }

          for name in ("led-matrix", "pixel-grid"):
              assert name in scripts, f"Missing console script: {name}"
              assert callable(scripts[name].load()), f"Entry point is not callable: {name}"
          PY

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          base_sha = os.environ["BASE_SHA"]
          if not base_sha.strip("0"):
              base_sha = subprocess.run(
                  ["git", "hash-object", "-t", "tree", "/dev/null"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip()

          diff = subprocess.run(
              ["git", "diff", "--unified=0", base_sha, "HEAD", "--", "*.py"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          changed_lines = {}
          current_file = None
          for line in diff.splitlines():
              if line.startswith("+++ b/"):
                  current_file = line[6:]
                  changed_lines.setdefault(current_file, set())
              elif line.startswith("+++ "):
                  current_file = None
              elif line.startswith("@@") and current_file:
                  match = re.search(r"\+(\d+)(?:,(\d+))?", line)
                  if match:
                      start = int(match.group(1))
                      count = int(match.group(2) or 1)
                      changed_lines[current_file].update(range(start, start + count))

          files = sorted(path for path, lines in changed_lines.items() if lines)
          if not files:
              print("No changed Python lines to lint.")
              sys.exit(0)

          result = subprocess.run(
              [
                  "ruff",
                  "check",
                  "--select",
                  "E4,E7,E9,F",
                  "--output-format",
                  "json",
                  *files,
              ],
              capture_output=True,
              text=True,
          )
          if result.returncode not in (0, 1):
              print(result.stderr, file=sys.stderr)
              sys.exit(result.returncode)

          root = Path.cwd()
          diagnostics = []
          for issue in json.loads(result.stdout):
              path = Path(issue["filename"])
              if path.is_absolute():
                  path = path.relative_to(root)
              row = issue["location"]["row"]
              if row in changed_lines.get(path.as_posix(), set()):
                  diagnostics.append(
                      f"{path}:{row}: {issue['code']} {issue['message']}"
                  )

          if diagnostics:
              print("\n".join(diagnostics), file=sys.stderr)
              sys.exit(1)
          PY
