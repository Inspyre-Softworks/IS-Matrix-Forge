name: Feature Request
description: Suggest a new feature or enhancement for IS Matrix Forge
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe your idea as clearly as possible.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: Is your feature request related to a problem? Describe the use-case or pain point.
      placeholder: "I find it difficult to ... / There is currently no way to ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you'd like to see added or changed.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered any workarounds or alternative solutions? Why are they insufficient?

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other context, mockups, or links that may help clarify the request.
